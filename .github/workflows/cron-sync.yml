name: Cron Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/sync-dmm-items.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
      - run: pnpm tsx scripts/post-sales-to-x.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ se          X_ACCESS_TOKEC          X_ACCESS_TOKEUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
